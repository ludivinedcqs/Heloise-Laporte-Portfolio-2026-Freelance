{% extends "layout.html" %}
{% block content %}
<h1>{{ t["change_password_title"] }}</h1>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>{{ t["current_password"] }}:</label><br>
<input type="password" name="current" required><br><br>
<label>{{ t["new_password"] }}:</label><br>
<input type="password" name="new" required><br><br>
<label>{{ t["new_password2"] }}:</label><br>
<input type="password" name="new2" required><br><br>
<button type="submit">{{ t["change_password_submit"] }}</button>
</form>
{% endblock %}
